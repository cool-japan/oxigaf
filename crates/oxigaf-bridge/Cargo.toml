[package]
name = "oxigaf-bridge"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Bridge layer for OxiGAF: convert checkpoints between GAF, ToRSh, and PyTorch formats"
readme = "README.md"
keywords = ["gaussian-splatting", "model-conversion", "3d", "avatar", "interop"]
categories = ["graphics", "science", "algorithms"]

[dependencies]
# Serialization
safetensors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Precision conversion
half = "2.7"

# Logging
tracing = { workspace = true }

# ToRSh integration (Pure Rust, feature-gated)
torsh-core = { version = "0.1.2", optional = true }
torsh-tensor = { version = "0.1.2", optional = true }
torsh-nn = { version = "0.1.2", optional = true, features = ["safetensors"] }
bytemuck = { version = "1.25", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
approx = { workspace = true }
candle-core = { workspace = true }
candle-nn = { workspace = true }

# Example dependencies
clap = { workspace = true }
indicatif = { workspace = true }
rayon = { workspace = true }
glob = "0.3"
tracing-subscriber = { workspace = true }
bytemuck = "1.25"

[features]
default = []
torsh = ["dep:torsh-core", "dep:torsh-tensor", "dep:torsh-nn", "dep:bytemuck"]

[[example]]
name = "convert_gaf_checkpoint"
required-features = ["torsh"]

[[example]]
name = "batch_convert"
required-features = ["torsh"]

[[example]]
name = "validate_conversion"
required-features = ["torsh"]
