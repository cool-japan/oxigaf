[package]
name = "oxigaf-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oxigaf-bridge"
description = "Bridge layer for OxiGAF: convert checkpoints between GAF, ToRSh, and PyTorch formats"
readme = "README.md"
keywords = ["gaussian-splatting", "model-conversion", "3d", "avatar", "interop"]
categories = ["graphics", "science", "algorithms"]

[package.metadata.docs.rs]
features = ["torsh"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Serialization
safetensors = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Precision conversion
half = { workspace = true }

# Logging
tracing = { workspace = true }

# ToRSh integration (Pure Rust, feature-gated). torsh-core is intentionally
# not a direct dependency: nothing in src/ references `torsh_core::` paths
# directly, only torsh_nn::serialization and torsh_tensor::Tensor, so it is
# pulled in transitively through those two instead of duplicated here.
torsh-tensor = { workspace = true, optional = true }
torsh-nn = { workspace = true, optional = true, features = ["safetensors"] }
bytemuck = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
approx = { workspace = true }
candle-core = { workspace = true }
candle-nn = { workspace = true }

# Example dependencies (anyhow is used only by examples/, not by src/)
anyhow = { workspace = true }
clap = { workspace = true }
indicatif = { workspace = true }
rayon = { workspace = true }
glob = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = []
torsh = ["dep:torsh-tensor", "dep:torsh-nn", "dep:bytemuck"]

[[example]]
name = "convert_gaf_checkpoint"
required-features = ["torsh"]

[[example]]
name = "batch_convert"
required-features = ["torsh"]

[[example]]
name = "validate_conversion"
required-features = ["torsh"]
