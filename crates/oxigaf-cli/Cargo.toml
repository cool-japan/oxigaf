[package]
name = "oxigaf-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for OxiGAF — Gaussian Avatar Reconstruction"
readme = "README.md"
keywords = ["cli", "gaussian-splatting", "3d", "avatar", "tool"]
categories = ["command-line-utilities", "graphics", "multimedia"]

[[bin]]
name = "oxigaf"
path = "src/main.rs"

[dependencies]
oxigaf = { version = "0.1.0", path = "../oxigaf" }
oxigaf-flame = { version = "0.1.0", path = "../oxigaf-flame" }
oxigaf-trainer = { version = "0.1.0", path = "../oxigaf-trainer" }
clap = { workspace = true }
clap_complete = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
safetensors = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
indicatif = { workspace = true }
tokio = { workspace = true }
image = { workspace = true }
rand = { workspace = true }
nalgebra = { workspace = true }
bytemuck = { workspace = true }
wgpu = { workspace = true }
pollster = { workspace = true }
owo-colors = { workspace = true }
oxiarc-archive = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
crossterm = { workspace = true }
hf-hub = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }

[features]
# Default features (none - minimal configuration)
default = []

# Performance optimizations
# Note: `simd` requires nightly Rust; on stable it is accepted but compiled out.
simd = ["oxigaf/simd"]
parallel = ["oxigaf/parallel"]
flash_attention = ["oxigaf/flash_attention"]
mixed_precision = ["oxigaf/mixed_precision"]

# Debug features
gpu_debug = ["oxigaf/gpu_debug"]

# Convenience feature bundles
full_performance = ["oxigaf/full_performance"]
all_features = ["oxigaf/all_features"]
