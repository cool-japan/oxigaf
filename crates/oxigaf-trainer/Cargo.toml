[package]
name = "oxigaf-trainer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oxigaf-trainer"
description = "GAF optimization pipeline — iterative denoising distillation"
readme = "README.md"
keywords = ["training", "optimization", "3d", "gaussian-splatting", "ai"]
categories = ["science", "algorithms", "graphics"]

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nalgebra = { workspace = true }
ndarray = { workspace = true }
image = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wgpu = { workspace = true }

# Pure Rust deep learning for LPIPS
candle-core = { workspace = true }
candle-nn = { workspace = true }
safetensors = { workspace = true }

oxigaf-flame = { workspace = true }
oxigaf-diffusion = { workspace = true }
oxigaf-render = { workspace = true }

# Optional parallel processing. Not yet consumed by any src/ call site (see
# data_parallel.rs's std::thread::scope and continual_learning.rs's EWC
# Fisher update) — added so those can move onto rayon behind this feature;
# `cargo machete` will flag it unused until that lands.
rayon = { workspace = true, optional = true }

[features]
default = []
# Enable parallel processing with rayon (currently unwired — see the
# `rayon` dependency comment above)
parallel = ["dep:rayon"]

[dev-dependencies]
approx = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }
pollster = { workspace = true }
clap = { workspace = true }
tracing-subscriber = { workspace = true }

[[bench]]
name = "trainer_bench"
harness = false
